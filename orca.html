<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--win:#0F0F11;--card:#151518;--field:#1E1E23;--track:#2A2A31;--sel:#1C1C21;--text:#F4F4F5;--label:#C9C9D1;--muted:#7E7E88;--faint:#85858F;--line:#222227;--accent:#80B4F5;--ink:#141413;--pop:#18181C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;font-family:Outfit,system-ui,sans-serif}
body{margin:0;background:#121A26;color:var(--text)}
button{font:inherit;color:inherit}
button:focus-visible,.tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.stage{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px 12px;overflow:hidden}
.scene{position:absolute;inset:-12px;filter:blur(3px)}
.scene i{position:absolute;display:block}
.dim{position:absolute;inset:0;z-index:5;background:rgba(8,9,12,.55);display:none}
.scene{filter:none;transition:filter .15s}
.stage.open .scene{filter:blur(3px)}
.stage.open .dim{display:block}
.stage .win{display:none}
.stage.open .win{display:flex}

.win{--z:1.3;zoom:var(--z);position:relative;z-index:10;width:800px;max-width:calc((100vw - 24px)/var(--z));height:min(540px,calc((100vh - 32px)/var(--z)));min-height:min(420px,calc((100vh - 32px)/var(--z)));background:var(--win);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;color:var(--text);font-size:12px}
.bar{height:52px;flex:none;display:flex;justify-content:center;align-items:center;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs{display:flex;gap:2px}
.tab{display:flex;align-items:center;gap:7px;line-height:1;height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;flex:none}
.tab svg{flex:none}
.tab.a{background:#1A1A1E;color:var(--text)}
.body{flex:1;min-height:0;display:flex;gap:8px;padding:0 12px 12px}
.side{width:104px;flex:none;display:flex;flex-direction:column;min-height:0}
.list{display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
.m{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 10px;border:0;border-radius:8px;line-height:1;background:transparent;font-size:12px;color:var(--muted);width:100%;text-align:left;cursor:pointer;flex:none}
.m.on{color:var(--text);font-weight:500}
.m.sel{background:var(--sel)}
.m small{font-size:10px;font-weight:400;color:var(--faint)}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;padding:0 4px}
.me b{display:block;font-size:12px;font-weight:500;color:#E4E4E8;line-height:14px}
.me span{display:block;font-size:10px;color:var(--faint);line-height:12px;font-variant-numeric:tabular-nums}
.av{width:24px;height:24px;border-radius:12px;background:var(--accent);flex:none}

.main{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--track) transparent;padding-right:2px}
.cols{display:flex;gap:8px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.sec{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;height:24px;font-size:12px;color:var(--label)}
.row.h28{height:28px}
.row.off{color:var(--faint)}
.rt{display:flex;align-items:center;gap:10px;color:var(--muted)}

.kb{display:flex;align-items:center;justify-content:center;height:24px;min-width:110px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:var(--field);font-size:11px;color:var(--faint);cursor:pointer}
.kb.bound{color:var(--text);font-weight:500}
.kb.cap{background:transparent;border:1px dashed var(--accent);color:var(--accent)}

.dd{display:flex;align-items:center;justify-content:space-between;gap:8px;width:140px;height:28px;padding:0 10px;border:0;background:var(--field);border-radius:6px;font-size:12px;color:#E4E4E8;cursor:pointer;text-align:left}
.dd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd svg{flex:none}

.tr u::after{content:"";position:absolute;right:1px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--ink)}

.tg i{position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:#7E7E88;display:block;transition:transform .15s ease,background .15s}

.btn{display:flex;align-items:center;gap:6px;height:26px;padding:0 12px;border:0;border-radius:7px;background:var(--field);font-size:12px;color:#E4E4E8;cursor:pointer}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:40;pointer-events:none}

.toast.mod{padding:8px 15px;font-size:13px;font-weight:500;color:var(--text)}
.toast.mod.off{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.toast.out{opacity:0;transition:opacity .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.tg,.tg i{transition:none}}

@media (max-width:760px){

}

const dec=s=>{const t=String(s.step),i=t.indexOf('.');return i<0?0:t.length-i-1};
const num=(s,v)=>(+v).toFixed(dec(s));
const text=(s,v)=>s.t==='rg'?num(s,v[0])+' – '+num(s,v[1])+s.unit:num(s,v)+s.unit;
const pct=(s,v)=>(v-s.min)/(s.max-s.min)*100;
const fill=(s,v)=>s.t==='rg'?'left:'+pct(s,v[0])+'%;width:'+(pct(s,v[1])-pct(s,v[0]))+'%':'width:'+pct(s,v)+'%';

/* ---------- color ---------- */
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};const c=x=>Math.round(x*255).toString(16).padStart(2,'0');return('#'+c(f(5))+c(f(3))+c(f(1))).toUpperCase()}
function hex2hsv(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
const hsvKey=(m,id)=>m.name+':'+id;
function getHsv(m,id){const k=hsvKey(m,id);if(!state.hsv[k])state.hsv[k]=hex2hsv(state.mods[m.name].vals[id]);return state.hsv[k]}

function hudWm(){
 const el=$('#wm'),st=state.mods['Watermark'];
 if(!st||!st.on){el.hidden=true;return}
 const v=st.vals;el.hidden=false;
 el.className='hud wm '+({'Top left':'tl','Bottom left':'bl','Bottom right':'br','Top center':'tc'}[v.pos]||'tl')+(v.bg?' bg':'');
 el.style.fontSize=(16*v.scale)+'px';
 el.innerHTML=(v.style!=='Text only'?'<img src="'+LOGO+'" alt="">':'')+(v.style!=='Logo only'?'<span>Orca</span>':'');
}
function hud(){
 hudWm();
 const al=$('#al'),ks=$('#ks'),c=state.cfg,wm=$('#wm');
 ks.style.top=(!wm.hidden&&wm.classList.contains('tl'))?'calc('+(wm.offsetHeight+20)+'px + env(safe-area-inset-top,0px))':'';
 al.hidden=!c.arr;ks.hidden=!c.kbl;
 if(c.arr){
  const on=MODS.filter(m=>state.mods[m.name].on&&m.name!=='Watermark').sort((a,b)=>b.name.length-a.name.length);
  al.innerHTML=on.map(m=>'<div>'+esc(m.name)+'</div>').join('');
 }
 if(c.kbl){
  const b=MODS.filter(m=>state.mods[m.name].key);
  ks.innerHTML='<b>Keybinds</b>'+(b.length?b.map(m=>'<div'+(state.mods[m.name].on?' class="on"':'')+'><span>'+esc(m.name)+'</span><kbd>'+esc(state.mods[m.name].key)+'</kbd></div>').join(''):'<div><i>No keybinds set</i></div>')+'<div style="margin-top:4px"><i>GUI</i><kbd>Delete</kbd></div>';
 }
}

const sw=(id,label,on,attr)=>'<button class="tg'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" aria-label="'+esc(label)+'" '+attr+'><i></i></button>';
function kbHtml(key){return '<button class="kb '+(key?'bound':'idle')+'" data-act="bind" aria-label="Keybind">'+esc(key||'Not Bound')+'</button>'}

function tagsHtml(a){
 const chips=a.filter(id=>BYID[id]).slice(0,10).map(id=>{const it=BYID[id];return '<span class="chip"><i class="sq" style="background:'+it.c+'"></i>'+esc(it.name)+'<button data-act="untag" data-val="'+id+'" aria-label="Remove '+esc(it.name)+'">×</button></span>'}).join('');
 return chips+(a.length>10?'<span class="more">+'+(a.length-10)+' more</span>':'')+'<button class="add" data-act="pick">+ Add</button>';
}

function control(m,s,vals){
 const v=vals[s.id],L=esc(s.label);
 if(s.t==='sw')return{w:34,h:'<div class="row'+(v?'':' off')+'">'+L+sw(s.id,s.label,v,'data-act="sw" data-id="'+s.id+'"')+'</div>'};
 if(s.t==='dd')return{w:40,h:'<div class="row h28">'+L+'<button class="dd" data-act="dd" data-id="'+s.id+'" aria-haspopup="listbox" aria-expanded="false"><span>'+esc(v)+'</span>'+CARET+'</button><div class="pop" role="listbox" hidden>'+s.opts.map(o=>'<button class="opt'+(o===v?' on':'')+'" role="option" aria-selected="'+(o===v)+'" data-act="opt" data-id="'+s.id+'" data-val="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>'};
 if(s.t==='ms')return{w:40,h:'<div class="row h28">'+L+'<button class="dd" data-act="dd" data-id="'+s.id+'" aria-haspopup="listbox" aria-expanded="false"><span>'+esc(v.join(', ')||'None')+'</span>'+CARET+'</button><div class="pop" role="listbox" aria-multiselectable="true" hidden>'+s.opts.map(o=>'<button class="opt'+(v.includes(o)?' on':'')+'" role="option" aria-selected="'+v.includes(o)+'" data-act="opt" data-id="'+s.id+'" data-val="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>'};
 if(s.t==='sl')return{w:50,h:'<div class="sl-wrap"><div class="sh"><span>'+L+'</span><span data-out>'+text(s,v)+'</span></div><div class="tr" data-act="sl" data-id="'+s.id+'" role="slider" tabindex="0" aria-label="'+L+'" aria-valuemin="'+s.min+'" aria-valuemax="'+s.max+'" aria-valuenow="'+v+'"><u style="'+fill(s,v)+'"></u></div></div>'};
 if(s.t==='rg')return{w:50,h:'<div class="sl-wrap"><div class="sh"><span>'+L+'</span><span data-out>'+text(s,v)+'</span></div><div class="tr" data-act="rg" data-id="'+s.id+'" role="group" aria-label="'+L+'"><u class="d" style="'+fill(s,v)+'"></u></div></div>'};
 if(s.t==='col'){const c=getHsv(m,s.id);return{w:38,h:'<div class="row h28">'+L+'<button class="num" data-act="col" data-id="'+s.id+'" aria-haspopup="dialog" aria-expanded="false"><i class="sw" style="background:'+v+'"></i><span data-hex>'+v.slice(1)+'</span></button><div class="pop2" hidden><div class="sv" data-part="sv" style="--h:'+c[0]+'"><i></i></div><div class="hue" data-part="hue"><i></i></div></div></div>'};}
 if(s.t==='hb'){
  let b='';for(let n=1;n<=9;n++){const on=v.includes(n);b+='<button class="slot'+(on?' on':'')+'" data-act="slot" data-id="'+s.id+'" data-n="'+n+'" aria-pressed="'+on+'" aria-label="Slot '+n+'">'+n+'</button>'}
  return{w:66,h:'<div style="margin:2px 0"><div class="sh"><span>'+L+'</span></div><div class="hb" role="group" aria-label="'+L+'">'+b+'</div></div>'};
 }
 if(s.t==='it')return{w:72,h:'<div style="margin:2px 0"><div class="sh"><span>'+L+'</span><span data-out>'+v.length+' selected</span></div><div class="tags" data-tags="'+s.id+'">'+tagsHtml(v)+'</div></div>'};
 return{w:0,h:''};
}

function renderMain(){
 closeCap();
 const A=[],B=[];let wa=0,wb=0;
 const put=c=>{if(wa<=wb){A.push(c.html);wa+=c.w}else{B.push(c.html);wb+=c.w}};

  const n=state.sel.config;
  put({w:120,html:'<section class="card"><div class="sec">Profile</div><div class="row">Selected<span class="rt" style="color:var(--text)">'+esc(n)+'</span></div><div class="row">Status<span class="rt">'+(n===state.cfg.active?'Active':'Not loaded')+'</span></div><div class="btns"><button class="btn" data-act="cfg" data-do="save">Save</button><button class="btn" data-act="cfg" data-do="load">Load</button><button class="btn" data-act="cfg" data-do="new">New</button><button class="btn" data-act="cfg" data-do="delete">Delete</button></div></section>'});
  put({w:90,html:'<section class="card"><div class="sec">Options</div><div class="row'+(state.cfg.auto?'':' off')+'">Auto save'+sw('auto','Auto save',state.cfg.auto,'data-act="cfgsw" data-id="auto"')+'</div><div class="row'+(state.cfg.start?'':' off')+'">Load on start'+sw('start','Load on start',state.cfg.start,'data-act="cfgsw" data-id="start"')+'</div><div class="row'+(state.cfg.arr?'':' off')+'">Array list'+sw('arr','Array list',state.cfg.arr,'data-act="cfgsw" data-id="arr"')+'</div><div class="row'+(state.cfg.kbl?'':' off')+'">Keybind list'+sw('kbl','Keybind list',state.cfg.kbl,'data-act="cfgsw" data-id="kbl"')+'</div></section>'});

  Object.keys(m.groups).forEach(g=>{
   const cs=m.groups[g].map(s=>control(m,s,st.vals));

  });
 }
 mainEl.innerHTML='<div class="cols"><div class="col">'+A.join('')+'</div><div class="col">'+B.join('')+'</div></div>';
 if(state.cat!=='config'){const m=curMod();mainEl.querySelectorAll('[data-act="col"]').forEach(b=>paintColor(b.parentElement,m,b.dataset.id))}

/* ---------- popovers ---------- */
function closePops(except){
 mainEl.querySelectorAll('.pop:not([hidden]),.pop2:not([hidden])').forEach(p=>{
  if(p===except)return;
  p.hidden=true;p.classList.remove('up','down');
  const b=p.parentElement.querySelector('.dd,.num');if(b){b.classList.remove('open');b.setAttribute('aria-expanded','false')}
 });
}
function openPop(btn,pop){
 closePops(pop);
 const willOpen=pop.hidden;
 pop.hidden=!willOpen;btn.classList.toggle('open',willOpen);btn.setAttribute('aria-expanded',String(willOpen));
 if(!willOpen){pop.classList.remove('up','down');return}
 pop.classList.remove('up','down');
 const box=mainEl.getBoundingClientRect(),r=pop.getBoundingClientRect();
 if(pop.classList.contains('pop2')){if(r.top<box.top)pop.classList.add('down')}
 else if(r.bottom>box.bottom)pop.classList.add('up');
}

/* ---------- state changes ---------- */
function toast(name,msg,mod,off){
 if(document.querySelector('.stage').classList.contains('open'))return;
 const box=$('#toasts'),t=document.createElement('div');
 if(mod){t.className='toast mod'+(off?' off':'');t.textContent=name}
 else{t.className='toast';t.innerHTML='<b>'+esc(name)+'</b>'+esc(msg)}
 box.appendChild(t);
 while(box.children.length>4)box.firstChild.remove();
 setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),260)},2200);
}
function setEnabled(name,on,quiet){
 const st=state.mods[name];st.on=on;renderList();
 if(state.cat!=='config'&&state.sel[state.cat]===name){
  const b=mainEl.querySelector('[data-act="enable"]');
  if(b){b.classList.toggle('on',on);b.setAttribute('aria-checked',String(on));b.closest('.row').classList.toggle('off',!on)}
 }
 if(!quiet)toast(name,'',true,!on);
}
function closeCap(){state.cap=false}
function refreshKb(){const b=mainEl.querySelector('[data-act="bind"]');if(!b)return;const st=state.mods[curMod().name];b.className='kb '+(state.cap?'cap':st.key?'bound':'idle');b.textContent=state.cap?'Press a key…':(st.key||'Not Bound')}
function refreshTags(modName,id){
 if(state.cat==='config'||curMod().name!==modName)return;
 const c=mainEl.querySelector('[data-tags="'+id+'"]');if(!c)return;
 const a=state.mods[modName].vals[id];
 c.innerHTML=tagsHtml(a);c.parentElement.querySelector('[data-out]').textContent=a.length+' selected';
}

function paintSlider(tr,s,v){
 const u=tr.firstElementChild;u.style.cssText=fill(s,v);
 const out=tr.parentElement.querySelector('[data-out]');if(out)out.textContent=text(s,v);
 if(s.t==='sl')tr.setAttribute('aria-valuenow',String(v));
}
function paintColor(row,m,id){
 const [h,sa,v]=getHsv(m,id),hex=hsv2hex(h,sa,v),sv=row.querySelector('.sv'),hu=row.querySelector('.hue');
 sv.style.setProperty('--h',h);sv.firstElementChild.style.left=sa*100+'%';sv.firstElementChild.style.top=(1-v)*100+'%';
 hu.firstElementChild.style.left=h/360*100+'%';
 row.querySelector('.sw').style.background=hex;row.querySelector('[data-hex]').textContent=hex.slice(1);
 state.mods[m.name].vals[id]=hex;
}
function drag(el,e,cb){
 const r=el.getBoundingClientRect(),f=ev=>cb(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height)));
 try{el.setPointerCapture(e.pointerId)}catch(_){}
 f(e);
 const mv=ev=>f(ev),up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
const snap=(s,p)=>{const raw=s.min+p*(s.max-s.min),r=Math.round((raw-s.min)/s.step)*s.step+s.min;return +Math.min(s.max,Math.max(s.min,r)).toFixed(dec(s))};

/* ---------- item picker ---------- */
const pk=$('#pk'),pkQ=$('#pkQ'),pkL=$('#pkL'),pkTags=$('#pkTags');
const PK={mod:null,id:null,tag:'All',q:'',list:[],n:0};
const CHUNK=150;
const pkVals=()=>state.mods[PK.mod].vals[PK.id];
const tileHtml=(it,on)=>'<button class="it'+(on?' on':'')+'" data-item="'+it.id+'" aria-pressed="'+on+'" title="'+esc(it.name)+'"><i class="sq" style="background:'+it.c+'"></i><span>'+esc(it.name)+'</span></button>';
function pkFilter(){
 const sel=new Set(pkVals()),words=PK.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
 PK.list=CAT.filter(it=>(PK.tag==='All'||(PK.tag==='Selected'?sel.has(it.id):it.tag===PK.tag))&&words.every(w=>it.key.includes(w)));
}
function pkRender(){
 pkFilter();
 const sel=new Set(pkVals());
 PK.n=Math.min(CHUNK,PK.list.length);
 pkL.innerHTML=PK.list.length?PK.list.slice(0,PK.n).map(it=>tileHtml(it,sel.has(it.id))).join(''):'<div class="pk-empty">'+(PK.tag==='Selected'&&!PK.q?'Nothing selected yet.':'No items match “'+esc(PK.q)+'”.')+'</div>';
 pkL.scrollTop=0;pkCounts();
}
function pkMore(){
 if(PK.n>=PK.list.length)return;
 const sel=new Set(pkVals()),next=Math.min(PK.n+CHUNK,PK.list.length);
 pkL.insertAdjacentHTML('beforeend',PK.list.slice(PK.n,next).map(it=>tileHtml(it,sel.has(it.id))).join(''));
 PK.n=next;
}
function pkCounts(){
 const n=pkVals().length;
 $('#pkS').textContent=n+' selected';
 $('#pkC').textContent=PK.list.length.toLocaleString()+' item'+(PK.list.length===1?'':'s');
 const e=pkTags.querySelector('[data-tag="Selected"] em');if(e)e.textContent=n;
}
function renderPkTags(){
 const n=pkVals().length;
 const chips=[['All',CAT.length],['Selected',n]].concat(TAGS.map(t=>[t,TAGN[t]||0]));
 pkTags.innerHTML=chips.map(([t,c])=>'<button class="pt'+(t===PK.tag?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'<em>'+c+'</em></button>').join('');
}
function openPicker(modName,id){
 closePops();
 PK.mod=modName;PK.id=id;PK.tag='All';PK.q='';pkQ.value='';
 $('#pkT').textContent=modName+' · '+findDef(byName(modName),id).label;
 pk.hidden=false;renderPkTags();pkRender();
 setTimeout(()=>pkQ.focus(),0);
}
function closePicker(){
 const m=PK.mod,id=PK.id;
 pk.hidden=true;PK.mod=null;
 if(m)refreshTags(m,id);
}
function pkAfter(){
 pkCounts();refreshTags(PK.mod,PK.id);
}
pk.addEventListener('click',e=>{
 const d=e.target.closest('[data-pk]');
 if(d){
  const a=d.dataset.pk;
  if(a==='close')closePicker();
  else if(a==='clear'){state.mods[PK.mod].vals[PK.id]=[];pkRender();pkAfter()}
  else if(a==='all'){const s=new Set(pkVals());PK.list.forEach(it=>s.add(it.id));state.mods[PK.mod].vals[PK.id]=Array.from(s);pkRender();pkAfter()}
  return;
 }
 const t=e.target.closest('[data-tag]');
 if(t){PK.tag=t.dataset.tag;renderPkTags();pkRender();return}
 const i=e.target.closest('[data-item]');
 if(i){
  const arr=pkVals(),id=i.dataset.item,k=arr.indexOf(id);
  if(k<0)arr.push(id);else arr.splice(k,1);
  if(PK.tag==='Selected'&&k>=0){
   i.remove();const j=PK.list.findIndex(x=>x.id===id);if(j>=0){PK.list.splice(j,1);PK.n=Math.max(0,PK.n-1)}
   if(!PK.list.length)pkRender();
  }else{i.classList.toggle('on',k<0);i.setAttribute('aria-pressed',String(k<0))}
  pkAfter();
 }
});
pkQ.addEventListener('input',()=>{PK.q=pkQ.value;pkRender()});
pkL.addEventListener('scroll',()=>{if(pkL.scrollTop+pkL.clientHeight>pkL.scrollHeight-260)pkMore()});

/* ---------- events ---------- */
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.cat=b.dataset.cat;closePops();renderAll()});
listEl.addEventListener('click',e=>{const b=e.target.closest('[data-name]');if(!b)return;state.sel[state.cat]=b.dataset.name;renderList();renderMain()});
function toggleFromList(e){
 const b=e.target.closest('[data-name]');if(!b||state.cat==='config')return;
 e.preventDefault();const n=b.dataset.name;state.sel[state.cat]=n;setEnabled(n,!state.mods[n].on);renderMain();
}
listEl.addEventListener('dblclick',toggleFromList);
listEl.addEventListener('contextmenu',toggleFromList);

mainEl.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const act=t.dataset.act,m=state.cat==='config'?null:curMod();
 if(act==='enable'){setEnabled(m.name,!state.mods[m.name].on)}
 else if(act==='sw'){const st=state.mods[m.name],v=!st.vals[t.dataset.id];st.vals[t.dataset.id]=v;t.classList.toggle('on',v);t.setAttribute('aria-checked',String(v));t.closest('.row').classList.toggle('off',!v)}
 else if(act==='cfgsw'){const k=t.dataset.id,v=!state.cfg[k];state.cfg[k]=v;t.classList.toggle('on',v);t.setAttribute('aria-checked',String(v));t.closest('.row').classList.toggle('off',!v);hud()}
 else if(act==='bind'){closePops();state.cap=true;refreshKb();t.focus()}
 else if(act==='dd'||act==='col'){openPop(t,t.parentElement.querySelector('.pop,.pop2'))}
 else if(act==='slot'){
  const a=state.mods[m.name].vals[t.dataset.id],n=+t.dataset.n,i=a.indexOf(n);
  if(i<0){a.push(n);a.sort((x,y)=>x-y)}else a.splice(i,1);
  t.classList.toggle('on',i<0);t.setAttribute('aria-pressed',String(i<0));
 }
 else if(act==='pick'){openPicker(m.name,t.closest('[data-tags]').dataset.tags)}
 else if(act==='untag'){
  const id=t.closest('[data-tags]').dataset.tags,a=state.mods[m.name].vals[id],i=a.indexOf(t.dataset.val);
  if(i>=0)a.splice(i,1);refreshTags(m.name,id);
 }
 else if(act==='opt'){
  const s=findDef(m,t.dataset.id),st=state.mods[m.name],val=t.dataset.val,pop=t.parentElement,btn=pop.parentElement.querySelector('.dd');
  if(s.t==='dd'){st.vals[s.id]=val;pop.querySelectorAll('.opt').forEach(o=>{const on=o===t;o.classList.toggle('on',on);o.setAttribute('aria-selected',String(on))});btn.firstElementChild.textContent=val;closePops()}
  else{const a=st.vals[s.id],i=a.indexOf(val);if(i<0)a.push(val);else a.splice(i,1);t.classList.toggle('on',i<0);t.setAttribute('aria-selected',String(i<0));btn.firstElementChild.textContent=a.join(', ')||'None'}
 }
 else if(act==='cfg'){
  const c=state.cfg,n=state.sel.config,d=t.dataset.do;
  if(d==='save')toast('Config','Saved “'+n+'”.');
  else if(d==='load'){c.active=n;renderList();renderMain();toast('Config','Loaded “'+n+'”.')}
  else if(d==='new'){let i=1;while(c.list.includes('profile '+i))i++;const nn='profile '+i;c.list.push(nn);state.sel.config=nn;renderList();renderMain();toast('Config','Created “'+nn+'”.')}
  else if(d==='delete'){if(c.list.length<2){toast('Config','Keep at least one profile.');return}c.list=c.list.filter(x=>x!==n);if(c.active===n)c.active=c.list[0];state.sel.config=c.list[0];renderList();renderMain();toast('Config','Deleted “'+n+'”.')}
 }
});

mainEl.addEventListener('pointerdown',e=>{
 const part=e.target.closest('[data-part]');
 if(part){
  const row=part.closest('.row'),id=row.querySelector('[data-act="col"]').dataset.id,m=curMod(),c=getHsv(m,id);
  e.preventDefault();
  if(part.dataset.part==='sv')drag(part,e,(x,y)=>{c[1]=x;c[2]=1-y;paintColor(row,m,id)});
  else drag(part,e,x=>{c[0]=x*360;paintColor(row,m,id)});
  return;
 }
 const tr=e.target.closest('.tr');if(!tr)return;
 e.preventDefault();tr.focus({preventScroll:true});
 const m=curMod(),s=findDef(m,tr.dataset.id),vals=state.mods[m.name].vals;
 if(s.t==='sl'){drag(tr,e,x=>{vals[s.id]=snap(s,x);paintSlider(tr,s,vals[s.id])});return}
 let idx=null;
 drag(tr,e,x=>{
  const a=vals[s.id];
  if(idx===null){const pa=pct(s,a[0])/100,pb=pct(s,a[1])/100;idx=Math.abs(x-pa)<Math.abs(x-pb)||(x<pa)?0:1}
  const v=snap(s,x);
  if(idx===0)a[0]=Math.min(v,a[1]);else a[1]=Math.max(v,a[0]);
  paintSlider(tr,s,a);
 });
});
mainEl.addEventListener('keydown',e=>{
 const tr=e.target.closest('.tr[data-act="sl"]');if(!tr)return;
 const dir=e.key==='ArrowRight'||e.key==='ArrowUp'?1:e.key==='ArrowLeft'||e.key==='ArrowDown'?-1:0;if(!dir)return;
 e.preventDefault();const m=curMod(),s=findDef(m,tr.dataset.id),vals=state.mods[m.name].vals;
 vals[s.id]=+Math.min(s.max,Math.max(s.min,vals[s.id]+dir*s.step)).toFixed(dec(s));paintSlider(tr,s,vals[s.id]);
});

document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('.pop,.pop2,.dd,.num'))closePops();
 if(state.cap&&!e.target.closest('[data-act="bind"]')){state.cap=false;refreshKb()}
});
function setGui(open){
 const st=document.querySelector('.stage');st.classList.toggle('open',open);
 if(!open){closePops();state.cap=false;refreshKb();if(!pk.hidden)closePicker();$('#toasts').innerHTML=''}
}
document.addEventListener('keydown',e=>{
 if(e.key==='Delete'&&!state.cap&&pk.hidden&&!e.repeat){
  e.preventDefault();e.stopPropagation();
  setGui(!document.querySelector('.stage').classList.contains('open'));return;
 }
 /* while the item picker is open, typing goes to its search box and never triggers keybinds */
 if(!pk.hidden){
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePicker()}
  return;
 }
 if(state.cap){
  e.preventDefault();e.stopPropagation();
  if(e.key==='Escape'){state.cap=false;refreshKb();return}
  const m=curMod(),st=state.mods[m.name];
  if(e.key==='Backspace'||e.key==='Delete'){st.key=null}
  else{
   const k=keyName(e);
   for(const o of MODS)if(o!==m&&state.mods[o.name].key===k)state.mods[o.name].key=null;
   st.key=k;
  }
  state.cap=false;refreshKb();renderList();
  const b=mainEl.querySelector('[data-act="bind"]');if(b)b.blur();
  toast(m.name,st.key?'Bound to '+st.key+'.':'Keybind cleared.');
  return;
 }
 if(e.key==='Escape'){closePops();return}
 if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=keyName(e);
 for(const m of MODS)if(state.mods[m.name].key===k)setEnabled(m.name,!state.mods[m.name].on);
},true);

document.addEventListener('click',()=>hud());
document.addEventListener('pointerup',()=>hud());
document.addEventListener('pointermove',e=>{if(e.buttons)hud()});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('.tr'))setTimeout(hud,0)});

/* ---------- uptime ---------- */
const t0=Date.now()-84*60000;
function fmtUp(sec){const h=Math.floor(sec/3600),mn=Math.floor(sec%3600/60);return h?h+'hr '+mn+'min':mn?mn+'min':sec+'sec'}
function tick(){$('#up').textContent='Uptime '+fmtUp(Math.floor((Date.now()-t0)/1000))}
setInterval(tick,1000);tick();

renderAll();
})();
</script>
</body>
</html>
